name: Diagnostics

# Ручная диагностика прода (Actions → Diagnostics → Run workflow).
# Ничего не меняет: только читает БД и проверяет доступность.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Внешняя доступность (взгляд «снаружи», как у пользователя)
        # Адрес берётся из секрета: репозиторий публичный, и зашивать в него
        # адрес боевого сервера незачем.
        env:
          BASE: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          if [ -z "$BASE" ]; then
            echo "Секрет PUBLIC_BASE_URL не задан — внешнюю проверку пропускаем"
            exit 0
          fi
          echo "health:      $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/health")"
          echo "unsubscribe: $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/unsubscribe?e=notanemail")  (400 = страница доступна, адрес невалиден — это ок)"
          # Заголовки показывают, КТО ответил. Чужой Server на 404 означает, что
          # отвечает проксирование хостинга, а не приложение: чинить тогда надо
          # привязку домена, а не сервис — снаружи эти случаи неотличимы.
          echo "--- кто ответил ---"
          # -D- вместо -I: HEAD на этом маршруте не разрешён, и 405 в ответе
          # сбивал бы с толку. Нужен не код, а строка Server.
          curl -s -D- -o /dev/null --max-time 15 "$BASE/health" | head -5 || true

      - name: Установка sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Состояние базы отписки на сервере
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/rassilka' }}
        run: |
          # ConnectTimeout большой: VPS Jino отвечает SSH-баннером с задержкой,
          # и на стандартных 10 секундах соединение рвётся на исправном сервере.
          sshpass -e ssh -p "${PORT:-22}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=120 "$USER@$HOST" \
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/rassilka}" bash -s <<'REMOTE'
          set -e
          # Доступ к базе берём из серверного .env: дублировать логин и пароль
          # ещё и в секретах репозитория — лишнее место, где они разъедутся.
          cd "$DEPLOY_PATH"
          # Из .env берём ровно два значения построчно, а не подключаем его
          # целиком через `.`: это файл настроек, а не скрипт. Любое значение с
          # пробелом bash принимает за команду («Logistic: command not found»),
          # а значение с обратными кавычками он ВЫПОЛНИТ — пароль из .env
          # превращается в команду на сервере.
          envval() { grep -E "^$1=" .env | head -1 | cut -d= -f2-; }
          POSTGRES_USER=$(envval POSTGRES_USER)
          POSTGRES_DB=$(envval POSTGRES_DB)
          PSQL="docker exec rassilka-db psql -U $POSTGRES_USER -d $POSTGRES_DB -tAc"
          echo "=== combine_body в работающем образе (1 = новый код) ==="
          docker exec rassilka-web sh -c "grep -c 'def combine_body' /app/cbmail/domain/composer.py" || true
          echo "=== PUBLIC_BASE_URL ==="
          docker exec rassilka-web sh -c 'echo $PUBLIC_BASE_URL'
          echo "=== кто может войти ==="
          # Пустой список означает, что в систему не войти вообще: пользователей
          # заводит только существующий администратор, и первого взять неоткуда.
          $PSQL "select username || '  | админ=' || is_superuser || '  | активен=' || is_active from useraccount_profile order by date_joined" || echo "нет пользователей"
          echo "=== cbmail_unsubscribe (email | scope) ==="
          $PSQL "select email || '  |  ' || coalesce(scope,'(пусто=глобально)') from cbmail_unsubscribe order by id" || echo "таблицы нет/пусто"
          echo "=== mail_stoplist (общий ручной блок) ==="
          $PSQL "select coalesce(list,'(пусто)') from mail_stoplist" || echo "пусто"
          echo "=== SMTP-профили (домен отправителя определяет область отписки) ==="
          $PSQL "select id || '  |  ' || coalesce(title,'') || '  | host=' || coalesce(email_host,'') || '  | login=' || coalesce(email_host_user,'') || '  | from=' || coalesce(default_from_email,'') from mail_usersettingssmtp order by id" || echo "нет профилей"
          echo "=== кампании (id | статус | from_email | smtp_id) ==="
          $PSQL "select id || '  |  ' || status || '  |  from=' || coalesce(from_email,'') || '  |  smtp=' || coalesce(use_smtp_settings_id::text,'-') from mail_massmailcampaign order by id desc limit 10" || echo "нет кампаний"
          echo ""
          echo "=== почему рассылки не уходят ==="
          # Статус, причина переноса, занятость воркера и остаток суточной
          # квоты ящика — рядом. Поодиночке все четыре состояния выглядят как
          # «кампания висит», и разбирались они раньше вручную по четырём местам.
          # Через docker cp, а не из образа: _config на сервер кладёт деплой,
          # внутрь образа он не попадает.
          docker cp _config/campaigns-status.py rassilka-web:/tmp/campaigns-status.py
          docker exec rassilka-web python /tmp/campaigns-status.py || true
          echo ""
          echo "=== планировщик (без него расписание не работает) ==="
          docker inspect -f 'rassilka-scheduler запущен={{.State.Running}}' rassilka-scheduler \
            || echo "контейнера rassilka-scheduler нет — запланированные кампании уходить не будут"
          REMOTE
