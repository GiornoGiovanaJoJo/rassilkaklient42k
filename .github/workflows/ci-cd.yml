name: CI/CD

# Тесты гоняются на каждый push и PR. Деплой — только из main (или вручную) и
# лишь после зелёных тестов: выкатывать непроверенный код на сервер, с которого
# уходят письма живым получателям, нельзя.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты и линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Линтер (ruff)
        working-directory: app
        run: ruff check .

      - name: Тесты (pytest)
        working-directory: app
        run: pytest -q

  # Отдельный шаг-страж: секрет нельзя прочитать в условии job напрямую, а
  # запускать деплой «в никуда» нельзя — он упадёт на первом же ssh и покажет
  # красный крест там, где всё в порядке, просто сервер ещё не подключён.
  check-secrets:
    name: Данные сервера заданы?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$PASSWORD" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "Данные сервера заданы — деплой выполнится."
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "Секреты SSH_HOST / SSH_USER / SSH_PASSWORD не заданы."
            echo "Деплой пропускаем: код проверен, выкатывать пока некуда."
            echo "Задать: Settings → Secrets and variables → Actions."
          fi

  deploy:
    name: Деплой на сервер
    needs: [test, check-secrets]
    if: |
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.check-secrets.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    concurrency:
      # Два деплоя разом недопустимы: второй перезапишет код под работающей
      # сборкой первого.
      group: production-deploy
      cancel-in-progress: false

    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      HOST: ${{ secrets.SSH_HOST }}
      PORT: ${{ secrets.SSH_PORT || '22' }}
      USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/rassilka' }}

    steps:
      - uses: actions/checkout@v4

      - name: Установка sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Проверка доступа к серверу
        run: |
          # Отдельным шагом и первым: если сервер недоступен, человек должен
          # увидеть это сразу, а не угадывать среди сотни строк сборки.
          #
          # ConnectTimeout большой намеренно: VPS Jino отвечает SSH-баннером с
          # задержкой, и на стандартных 10 секундах соединение рвалось с
          # «Connection timed out during banner exchange» — сервер при этом был
          # полностью исправен.
          sshpass -e ssh -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=120 -o ServerAliveInterval=30 \
            "$USER@$HOST" 'echo "сервер отвечает: $(hostname)"'

      - name: Подготовка сервера
        # На свежей VPS Docker не стоит. Ставим сами, а не падаем с инструкцией:
        # иначе первая выкатка на новый сервер всегда красная, и человеку нужно
        # идти в консоль ровно за одной командой, которую можно выполнить здесь.
        # Повторные выкатки этот шаг проходят насквозь — Docker уже на месте.
        run: |
          sshpass -e ssh -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=120 -o ServerAliveInterval=30 \
            "$USER@$HOST" bash -s <<'REMOTE'
          set -e
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive

          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            echo "Docker на сервере нет — устанавливаем (это занимает пару минут)."
            command -v curl >/dev/null 2>&1 || {
              $SUDO apt-get update -qq
              $SUDO apt-get install -y -qq curl
            }
            curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
            $SUDO sh /tmp/get-docker.sh
            rm -f /tmp/get-docker.sh
          fi

          command -v tar >/dev/null 2>&1 || $SUDO apt-get install -y -qq tar

          missing=""
          command -v docker >/dev/null 2>&1 || missing="$missing docker"
          docker compose version >/dev/null 2>&1 || missing="$missing docker-compose-plugin"
          command -v tar >/dev/null 2>&1 || missing="$missing tar"
          if [ -n "$missing" ]; then
            echo "Установка не удалась, на сервере по-прежнему нет:$missing"
            exit 1
          fi
          echo "docker: $(docker --version)"
          echo "compose: $(docker compose version --short)"
          REMOTE

      - name: Копирование кода
        run: |
          # tar-over-ssh вместо rsync: rsync на сервере может не стоять, tar
          # есть везде. Без --delete: серверные .env и license.key в архив не
          # попадают и не должны пострадать.
          tar czf - \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='*.egg-info' \
            --exclude='.venv' --exclude='*.sqlite3' --exclude='license.key' \
            --exclude='.git' --exclude='.github' \
            app _config docker-compose.yaml .env.example \
          | sshpass -e ssh -p "$PORT" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=120 -o ServerAliveInterval=30 \
              "$USER@$HOST" "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"

      - name: Настройка окружения
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          # .env собирается из секрета APP_ENV, а не правится руками на сервере:
          # иначе настройки живут в одном экземпляре на диске VPS, и после
          # переустановки сервера их неоткуда взять.
          #
          # Пишется ПОСЛЕ копирования кода и ПЕРЕД запуском: архив .env не
          # содержит, а compose читает его на старте.
          if [ -z "$APP_ENV" ]; then
            echo "Секрет APP_ENV не задан — оставляем .env, который уже лежит на сервере."
            exit 0
          fi
          # Через stdin, а не аргументом команды: аргументы видны в списке
          # процессов на сервере любому пользователю, а здесь пароли.
          printf '%s\n' "$APP_ENV" | sshpass -e ssh -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=120 -o ServerAliveInterval=30 \
            "$USER@$HOST" "mkdir -p '$DEPLOY_PATH' && cat > '$DEPLOY_PATH/.env' && chmod 600 '$DEPLOY_PATH/.env'"
          echo ".env записан из секрета APP_ENV"

      - name: Сборка и запуск
        run: |
          sshpass -e ssh -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=120 -o ServerAliveInterval=30 \
            "$USER@$HOST" DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "Нет файла .env — сервис не настроен."
            echo "Задайте секрет APP_ENV в GitHub (его содержимое и станет .env)"
            echo "или создайте файл на сервере:"
            echo "  cd $DEPLOY_PATH && cp .env.example .env && nano .env"
            exit 1
          fi

          docker compose build web
          docker compose up -d --force-recreate web worker

          PORT_APP=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d '[:space:]')
          PORT_APP=${PORT_APP:-8002}
          echo "Ожидание health на порту $PORT_APP..."
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT_APP/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health 200 (попытка $i)"
              docker compose ps

              # Health отвечает и без лицензии, но без неё сервис закрыт весь,
              # кроме страницы активации. Молчать об этом нельзя: деплой
              # «успешен», а войти нельзя — выглядит как поломка.
              echo ""
              # Состояние лицензии отдельным файлом: внутри двух вложенных
              # heredoc любая кавычка в однострочнике превращается в
              # нерабочую команду, и замечаешь это уже на сервере.
              docker cp _config/license-status.py rassilka-web:/tmp/license-status.py
              docker exec rassilka-web python /tmp/license-status.py || true

              # «Профиль создан» и «через него можно отправить» — разные вещи.
              # Проверяем авторизацию на почтовом сервере, иначе первая же
              # рассылка не уйдёт, а деплой будет считаться успешным.
              echo ""
              docker cp _config/smtp-status.py rassilka-web:/tmp/smtp-status.py
              docker exec rassilka-web python /tmp/smtp-status.py || true
              exit 0
            fi
            sleep 2
          done

          echo "Сервис не ответил на /health. Журнал:"
          docker compose logs --tail 60 web
          exit 1
          REMOTE
