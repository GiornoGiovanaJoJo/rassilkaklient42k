name: Проверка оформления
on: { workflow_dispatch: }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          BASE: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          for f in css/core.css demo.css main.js config.js js/helpers.js js/menu.js \
                   js/bootstrap.js js/template-customizer.js fonts/iconify-icons.css \
                   libs/jquery/jquery.js libs/popper/popper.js libs/pickr/pickr.js \
                   libs/pickr/pickr-themes.css libs/perfect-scrollbar/perfect-scrollbar.js \
                   libs/perfect-scrollbar/perfect-scrollbar.css libs/hammer/hammer.js \
                   libs/emailbuilder/index.html libs/emailbuilder/assets/index-CU3-CREv.js; do
            printf '%-50s %s\n' "$f" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/static/moderation/$f")"
          done
          printf '%-50s %s\n' "страница входа" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/login")"
